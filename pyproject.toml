[build-system]
# Cython compiles the engine (setup.py); without a C compiler the build
# falls back to the pure-Python engine.
requires = ["setuptools>=77", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dotted_notation"
version = "0.46.0"
description = "Dotted notation for safe nested data traversal with optional chaining, pattern matching, and transforms"
readme = "README.md"
requires-python = ">=3.6"
license = "MIT"
authors = [
    { name = "Frey Waid", email = "logophage1@gmail.com" },
]
keywords = [
    "dotted",
    "nested",
    "path",
    "pattern-matching",
    "json",
    "jsonb",
    "sql",
    "traversal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "pyparsing>=3.0",
]

[project.optional-dependencies]
# No environment markers on anything below: a marker of its own makes
# pypistats list an extra as a hard requirement. So copium is not limited to
# CPython 3.10+ here, though copium itself is, and tomli is not limited to
# Python < 3.11, where the standard library's tomllib is used instead.
copium = ["copium>=0.1.0"]
yaml = ["PyYAML>=5.0"]
toml = ["tomli>=1.0", "tomli_w>=1.0"]
formats = [
    "PyYAML>=5.0",
    "tomli>=1.0",
    "tomli_w>=1.0",
]
# Every extra above.
all = [
    "copium>=0.1.0",
    "PyYAML>=5.0",
    "tomli>=1.0",
    "tomli_w>=1.0",
]

[project.scripts]
dq = "dotted.cli.main:main"

[project.urls]
Homepage  = "https://github.com/freywaid/dotted"
Source    = "https://github.com/freywaid/dotted"
Changelog = "https://github.com/freywaid/dotted/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["dotted*"]

[tool.cibuildwheel]
# Compiled wheels for CPython 3.11-3.14 (the versions are listed in the
# publish workflow, one job each); everything else installs the pure wheel.
skip = "pp*"
test-requires = "pytest"
test-command = "python -c \"import dotted; assert dotted.native.active(), 'the compiled engine did not load'\" && pytest {project}/tests -q -p no:cacheprovider --import-mode=importlib"
