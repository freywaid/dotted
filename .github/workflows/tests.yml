name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[formats,copium]"
          pip install pytest
      - name: Run tests
        run: DOTTED_NATIVE=0 pytest
      - name: Build the native engine
        run: |
          pip install cython
          python setup.py build_ext --inplace
          python -c "import dotted; assert dotted.native.active(), 'the compiled engine did not load'"
      - name: Run tests on the native engine
        run: pytest
